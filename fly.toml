# fly.toml app configuration file generated for agrigpt-ai on 2026-11-24T19:51:21Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'agrigpt-ai'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
